[project]
name = "tropelex"
version = "1.2.0"
description = "AI Memory System with Safety and Alignment Infrastructure"
requires-python = ">=3.10"
license = { text = "MIT" }
readme = "README.md"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "jinja2>=3.0.0",
    "python-multipart>=0.0.6",
    "requests>=2.28.0",
    "httpx>=0.27.0",
    "ddgs>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
adapters = [
    "langgraph>=1.2.11",
]

[project.scripts]
tropelex = "core.tropebook.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument (FastAPI Depends)
    "B905",   # zip() without strict= (not needed for internal use)
]

[tool.ruff.lint.isort]
known-first-party = ["core", "adapters"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "last30days: tests that touch the last30days engine (may consume API tokens)",
]
